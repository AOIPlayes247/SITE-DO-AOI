<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOIofc1</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            overflow-x: hidden;
        }
        /* FAIXA DE LED */
        .led {
            position: fixed;
            top: 0;
            left: -100%;
            width: 70%;
            height: 4px;
            background: linear-gradient(
                90deg,
                transparent,
                #ff0000,
                #ffffff,
                #ff0000,
                transparent
            );
            box-shadow:
                0 0 10px #ff0000,
                0 0 25px #ff0000,
                0 0 45px #ff0000;
            animation: ledPassando 4s linear infinite;
            z-index: 999;
        }
        @keyframes ledPassando {
            0% { left: -70%; }
            100% { left: 100%; }
        }
        /* CABEÇALHO */
        header {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background:
                radial-gradient(
                    circle at center,
                    #300000 0%,
                    #100000 25%,
                    #050505 65%
                );
            padding: 40px 20px;
        }
        h1 {
            font-size: 80px;
            margin: 0;
            color: white;
            text-shadow:
                0 0 10px #ff0000,
                0 0 25px #ff0000,
                0 0 50px #ff0000;
        }
        .subtitulo {
            font-size: 22px;
            color: #cccccc;
            margin-top: 15px;
        }
        .linha {
            width: 180px;
            height: 4px;
            background: #ff0000;
            margin: 25px auto;
            box-shadow:
                0 0 10px #ff0000,
                0 0 25px #ff0000;
        }
        /* BOTÃO DE MÚSICA */
        .btn-musica {
            margin-top: 30px;
            padding: 14px 32px;
            border: 1px solid #ff0000;
            border-radius: 50px;
            background: #0d0d0d;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }
        .btn-musica:hover {
            background: #ff0000;
            transform: scale(1.05);
            box-shadow:
                0 0 15px #ff0000,
                0 0 30px #ff0000;
        }
        /* REDES */
        .redes {
            padding: 70px 20px;
            text-align: center;
            background: #080808;
        }
        .redes h2 {
            font-size: 35px;
            margin-bottom: 40px;
        }
        .botao {
            position: relative;
            display: block;
            width: 300px;
            max-width: 90%;
            margin: 18px auto;
            padding: 17px;
            border: 1px solid #ff0000;
            border-radius: 8px;
            background: #0d0d0d;
            color: white;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
        }
        .botao:hover {
            background: #ff0000;
            color: white;
            transform: scale(1.06);
            box-shadow:
                0 0 10px #ff0000,
                0 0 25px #ff0000,
                0 0 45px #ff0000;
        }
        /* RODAPÉ + CRÉDITOS */
        footer {
            padding: 40px 20px;
            text-align: center;
            background: #030303;
            border-top: 1px solid #ff0000;
            color: #888;
            font-size: 15px;
            line-height: 1.7;
        }
        footer strong {
            color: white;
        }
        .creditos {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #222;
            color: #777;
            font-size: 14px;
        }
        /* LED INFERIOR */
        .led-bottom {
            width: 100%;
            height: 3px;
            background: #ff0000;
            box-shadow:
                0 0 10px #ff0000,
                0 0 25px #ff0000;
            animation: pulsar 1.5s infinite alternate;
        }
        @keyframes pulsar {
            from {
                opacity: 0.4;
                box-shadow: 0 0 5px #ff0000;
            }
            to {
                opacity: 1;
                box-shadow:
                    0 0 15px #ff0000,
                    0 0 35px #ff0000;
            }
        }
        #player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="led"></div>

    <header>
        <h1>AOIofc1</h1>
        <div class="linha"></div>
        <p class="subtitulo">Bem-vindo AO CANTINHO DO AOI 🎮
